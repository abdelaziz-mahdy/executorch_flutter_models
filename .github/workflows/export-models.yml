name: Export Models

on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
  workflow_dispatch:
    inputs:
      executorch_versions:
        description: 'ExecuTorch versions to export (comma-separated or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '1.0.1'
          - '1.1.0'
          - '1.2.0'
          - '1.3.1'
          - '1.4.0'
      models:
        description: 'Models to export'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobilenet
          - yolo
          - yolo-pose
          - yolo-face
      backends:
        description: 'Backends to use'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - xnnpack
          - coreml
          - mps
          - vulkan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Determine which versions to build
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - name: Set versions matrix
        id: set-versions
        run: |
          INPUT="${{ github.event.inputs.executorch_versions }}"
          if [ -z "$INPUT" ]; then
            # Automatic trigger (push to python/): only build latest version
            echo 'versions=["1.4.0"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT" == "all" ]; then
            # Manual trigger with "all": rebuild all versions
            echo 'versions=["1.0.1", "1.1.0", "1.2.0", "1.3.1", "1.4.0"]' >> $GITHUB_OUTPUT
          else
            # Manual trigger with specific version
            echo "versions=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          fi

  # macOS exports all backends: xnnpack, coreml, vulkan, and metal (1.3.x+)
  export:
    runs-on: macos-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install executorch first (pulls correct torch version)
          pip install executorch==${{ matrix.version }}

          # Get torch version installed by executorch
          TORCH_VERSION=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          echo "Torch version from executorch: $TORCH_VERSION"

          # Install compatible torchvision based on torch version
          if [[ "$TORCH_VERSION" == 2.12.* ]]; then
            pip install "torchvision>=0.27.0,<0.28.0"
          elif [[ "$TORCH_VERSION" == 2.11.* ]]; then
            pip install "torchvision>=0.26.0,<0.27.0"
          elif [[ "$TORCH_VERSION" == 2.10.* ]]; then
            pip install "torchvision>=0.25.0,<0.26.0"
          elif [[ "$TORCH_VERSION" == 2.9.* ]]; then
            pip install "torchvision>=0.24.0,<0.25.0"
          elif [[ "$TORCH_VERSION" == 2.6.* ]]; then
            pip install "torchvision>=0.21.0,<0.22.0"
          elif [[ "$TORCH_VERSION" == 2.5.* ]]; then
            pip install "torchvision>=0.20.0,<0.21.0"
          elif [[ "$TORCH_VERSION" == 2.4.* ]]; then
            pip install "torchvision>=0.19.0,<0.20.0"
          else
            # Fallback: install without deps to avoid torch upgrade
            pip install --no-deps torchvision
          fi

          # Install remaining requirements (excluding torchvision which is already installed)
          pip install ultralytics>=8.3.0 onnx>=1.20.0 onnx2torch>=1.5.0 numpy pillow

          # Metal backend (1.3.x+) is AOTI-based and needs torchao rebuilt from
          # source with the experimental MPS ops - the PyPI wheel doesn't ship
          # libtorchao_ops_mps_aten.dylib. Skipped for versions without Metal.
          case "${{ matrix.version }}" in
            1.0.*|1.1.*|1.2.*)
              echo "Skipping torchao MPS build (no Metal backend for ${{ matrix.version }})"
              ;;
            *)
              echo "=== Building torchao with experimental MPS ops (for Metal export) ==="
              pip install pyyaml setuptools wheel cmake ninja
              TORCHAO_VER=$(python -c "import torchao; print(torchao.__version__.split('+')[0])")
              echo "Rebuilding torchao $TORCHAO_VER from git with TORCHAO_BUILD_EXPERIMENTAL_MPS=1"
              TORCHAO_BUILD_EXPERIMENTAL_MPS=1 CMAKE_BUILD_PARALLEL_LEVEL=4 \
                pip install -v --no-build-isolation --no-deps --force-reinstall \
                "git+https://github.com/pytorch/ao@v${TORCHAO_VER}"
              # AOTI links libomp at export time; point the linker at torch's bundled copy
              echo "LIBRARY_PATH=$(python -c 'import os,torch;print(os.path.join(os.path.dirname(torch.__file__),"lib"))')" >> "$GITHUB_ENV"
              ;;
          esac

          # Verify versions
          echo "=== Installed versions ==="
          python -c "import torch; print(f'torch: {torch.__version__}')"
          python -c "import torchvision; print(f'torchvision: {torchvision.__version__}')"
          pip show executorch | grep Version || echo "executorch version check skipped"

      - name: Parse inputs
        id: parse
        run: |
          MODELS="${{ github.event.inputs.models }}"
          BACKENDS="${{ github.event.inputs.backends }}"

          if [ -z "$MODELS" ]; then
            MODELS="all"
          fi

          # macOS supports these backends. The deprecated MPS backend has been
          # dropped; the new Metal backend (AOTI) exists from ExecuTorch 1.3.x
          # onward, so only request it for those versions.
          if [ -z "$BACKENDS" ] || [ "$BACKENDS" == "all" ]; then
            BACKENDS="xnnpack coreml vulkan"
            case "${{ matrix.version }}" in
              1.0.*|1.1.*|1.2.*) ;;  # Metal backend not available
              *) BACKENDS="$BACKENDS metal" ;;
            esac
          fi

          echo "models=$MODELS" >> $GITHUB_OUTPUT
          echo "backends=$BACKENDS" >> $GITHUB_OUTPUT

      - name: Create version directory
        run: |
          mkdir -p ${{ matrix.version }}/mobilenet
          mkdir -p ${{ matrix.version }}/yolo
          mkdir -p ${{ matrix.version }}/yolo-pose
          mkdir -p ${{ matrix.version }}/yolo-face

      - name: Export MobileNet
        if: steps.parse.outputs.models == 'mobilenet' || steps.parse.outputs.models == 'all'
        working-directory: python
        run: |
          python main.py export --mobilenet --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}

      - name: Export YOLO (all variants)
        if: steps.parse.outputs.models == 'yolo' || steps.parse.outputs.models == 'all'
        working-directory: python
        run: |
          python main.py export --yolo yolo11n --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}
          python main.py export --yolo yolov8n --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}
          python main.py export --yolo yolov5n --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}

      - name: Export YOLO-Pose (all variants)
        if: steps.parse.outputs.models == 'yolo-pose' || steps.parse.outputs.models == 'all'
        working-directory: python
        run: |
          python main.py export --yolo-pose yolo11n-pose --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}
          python main.py export --yolo-pose yolov8n-pose --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}

      - name: Export YOLO-Face (all variants)
        if: steps.parse.outputs.models == 'yolo-face' || steps.parse.outputs.models == 'all'
        working-directory: python
        run: |
          python main.py export --yolo-face yolov11n-face --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}
          python main.py export --yolo-face yolov10n-face --backends ${{ steps.parse.outputs.backends }} --output-dir ../${{ matrix.version }}

      - name: List exported files
        run: |
          echo "=== Files for version ${{ matrix.version }} ==="
          find ${{ matrix.version }} -name "*.pte" -type f
          echo "=== Directory structure ==="
          ls -la ${{ matrix.version }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ matrix.version }}
          path: ${{ matrix.version }}
          retention-days: 1

  # Release job: uploads model files as GitHub Release assets and commits metadata to repo
  release:
    runs-on: ubuntu-latest
    needs: [setup, export]
    if: needs.export.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Copy artifacts into version directories
        run: |
          VERSIONS='${{ needs.setup.outputs.versions }}'
          echo "Processing versions: $VERSIONS"

          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            echo "=== Processing version $VERSION ==="

            mkdir -p "$VERSION/mobilenet"
            mkdir -p "$VERSION/yolo"
            mkdir -p "$VERSION/yolo-pose"
            mkdir -p "$VERSION/yolo-face"

            if [ -d "_artifacts/models-$VERSION" ]; then
              echo "Copying artifacts for $VERSION"
              cp -r "_artifacts/models-$VERSION"/* "$VERSION/"
            fi

            echo "Files for $VERSION:"
            find "$VERSION" -name "*.pte" -type f | wc -l
          done

          # Clean up temporary artifacts directory
          rm -rf _artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and prepare labels
        run: |
          MOBILENET_LABELS_URL="https://raw.githubusercontent.com/pytorch/hub/master/imagenet_classes.txt"
          COCO_LABELS="person,bicycle,car,motorcycle,airplane,bus,train,truck,boat,traffic light,fire hydrant,stop sign,parking meter,bench,bird,cat,dog,horse,sheep,cow,elephant,bear,zebra,giraffe,backpack,umbrella,handbag,tie,suitcase,frisbee,skis,snowboard,sports ball,kite,baseball bat,baseball glove,skateboard,surfboard,tennis racket,bottle,wine glass,cup,fork,knife,spoon,bowl,banana,apple,sandwich,orange,broccoli,carrot,hot dog,pizza,donut,cake,chair,couch,potted plant,bed,dining table,toilet,tv,laptop,mouse,remote,keyboard,cell phone,microwave,oven,toaster,sink,refrigerator,book,clock,vase,scissors,teddy bear,hair drier,toothbrush"

          VERSIONS='${{ needs.setup.outputs.versions }}'
          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            if [ -d "$VERSION/mobilenet" ]; then
              curl -sL "$MOBILENET_LABELS_URL" -o "$VERSION/mobilenet/labels.txt" 2>/dev/null || true
            fi

            if [ -d "$VERSION/yolo" ]; then
              echo "$COCO_LABELS" | tr ',' '\n' > "$VERSION/yolo/labels.txt"
            fi
          done

      - name: Generate index.json for each version
        working-directory: python
        run: |
          VERSIONS='${{ needs.setup.outputs.versions }}'
          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            echo "Generating index.json for $VERSION"
            python -c "
          import sys
          sys.path.insert(0, '.')
          from main import generate_index_json
          version = '$VERSION'
          generate_index_json(f'../{version}', version=version)
          " || echo "Warning: Could not generate index.json for $VERSION"
          done

      - name: Upload models to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS='${{ needs.setup.outputs.versions }}'
          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            TAG="v$VERSION"
            echo "=== Uploading models for $TAG ==="

            # Create release if it doesn't exist
            if ! gh release view "$TAG" &>/dev/null; then
              echo "Creating release $TAG"
              gh release create "$TAG" \
                --title "ExecuTorch $VERSION Models" \
                --notes "Pre-exported ExecuTorch $VERSION models for executorch_flutter"
            else
              echo "Release $TAG already exists, will update assets"
              # Delete existing assets to replace with fresh exports
              for ASSET in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
                echo "  Deleting old asset: $ASSET"
                gh release delete-asset "$TAG" "$ASSET" --yes 2>/dev/null || true
              done
            fi

            # Upload all .pte files (filenames are unique across categories)
            find "$VERSION" -name "*.pte" -type f | while read -r FILE; do
              BASENAME=$(basename "$FILE")
              echo "  Uploading: $BASENAME"
              # Copy to /tmp to ensure flat filename (gh upload uses basename)
              cp "$FILE" "/tmp/$BASENAME"
              gh release upload "$TAG" "/tmp/$BASENAME" --clobber
            done

            # Upload labels with category prefix to avoid name collision
            # gh release upload doesn't support rename via #, so copy with new name
            for CATEGORY_DIR in "$VERSION"/*/; do
              CATEGORY=$(basename "$CATEGORY_DIR")
              if [ -f "$CATEGORY_DIR/labels.txt" ]; then
                LABEL_NAME="${CATEGORY}-labels.txt"
                cp "$CATEGORY_DIR/labels.txt" "/tmp/$LABEL_NAME"
                echo "  Uploading: $LABEL_NAME"
                gh release upload "$TAG" "/tmp/$LABEL_NAME" --clobber
              fi
            done

            echo "=== Done uploading for $TAG ==="
          done

      - name: List release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS='${{ needs.setup.outputs.versions }}'
          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            echo "=== Release v$VERSION assets ==="
            gh release view "v$VERSION" --json assets -q '.assets[] | "\(.name) (\(.size) bytes)"'
            echo ""
            if [ -f "$VERSION/index.json" ]; then
              echo "=== index.json summary for $VERSION ==="
              python -c "
          import json
          version = '$VERSION'
          try:
              with open(f'{version}/index.json') as f:
                  data = json.load(f)
              print(f'Total models: {len(data[\"models\"])}')
              for m in data['models']:
                  print(f'  - {m[\"name\"]} ({m[\"sizeMB\"]} MB)')
          except Exception as e:
              print(f'Error reading index.json: {e}')
          "
            fi
            echo ""
          done

      - name: Update versions.json
        env:
          VERSIONS_JSON: ${{ needs.setup.outputs.versions }}
        run: |
          python -c "
          import json
          import os

          versions_list = json.loads(os.environ['VERSIONS_JSON'])

          # Read current versions.json or create new
          try:
              with open('versions.json', 'r') as f:
                  data = json.load(f)
          except:
              data = {'versions': [], 'latest': None}

          # Ensure versions list exists
          if data.get('versions') is None:
              data['versions'] = []

          # Add versions if not present
          for version in versions_list:
              if version not in data['versions']:
                  data['versions'].append(version)

          # Sort versions
          data['versions'].sort()

          # Update latest to highest version
          if data['versions']:
              data['latest'] = data['versions'][-1]

          # Write back
          with open('versions.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f'Updated versions.json: {data}')
          "

      - name: Commit metadata to repo (index.json + versions.json only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit metadata files, NOT .pte files (those are in releases)
          VERSIONS='${{ needs.setup.outputs.versions }}'
          for VERSION in $(echo "$VERSIONS" | jq -r '.[]'); do
            # Ensure version directory exists in repo for index.json
            mkdir -p "$VERSION"
            # Only add index.json
            git add "$VERSION/index.json" 2>/dev/null || true
          done
          git add versions.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No metadata changes to commit"
          else
            MODELS="${{ github.event.inputs.models }}"
            BACKENDS="${{ github.event.inputs.backends }}"
            [ -z "$MODELS" ] && MODELS="all"
            [ -z "$BACKENDS" ] && BACKENDS="all"

            VERSION_STR=$(echo "$VERSIONS" | jq -r 'join(", ")')

            git commit -m "feat: Update model metadata for ExecuTorch $VERSION_STR"
            git push
          fi
